# /etc/nginx/conf.d/20-ct-code.conf — installed by deploy/apply-root.sh.
#
# Backends for the owner-only routes that have no in-app owner check (code-server runs as
# ctuser with auth off, so nginx is its only gate). $ct_user is filled by auth_request_set
# in the vhost; maps evaluate lazily, at proxy_pass time, so that value is already set.
# Anyone else on the roster is sent to a port nothing listens on and gets a 502.
map $ct_user $ct_code_backend {
    brandon  127.0.0.1:8443;
    default  127.0.0.1:1;
}
# Dev-server preview: /p/<port>/... -> 127.0.0.1:<port>/...  (owner only, same idea)
map "$ct_user:$ct_pport" $ct_preview_backend {
    ~^brandon:(?<n>\d+)$  127.0.0.1:$n;
    default               127.0.0.1:1;
}
