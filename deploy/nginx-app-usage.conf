# Additional location blocks for /etc/nginx/sites-enabled/claude-terminal.
# Paste these INSIDE the existing `server { ... }`, above the catch-all `location / `.
# Nothing here replaces an existing block; `^~` gives both prefixes priority over
# `location /`, which today swallows them and hands them to ttyd (hence the 404s).

# ---------------------------------------------------------------------------
# /app — the chat app (owner-gated, same as /_ct/).
#
# The built bundle fetches ABSOLUTE paths: /app/api/*, /app/stream/*, /app/assets/*.
# app-server.ts accepts /app* directly, so unlike the /_ct/ block there is NO rewrite
# here — proxy_pass carries no URI part, which is what makes nginx pass the original
# request URI through untouched.
location = /app {
    auth_request     /_ct_authz;
    auth_request_set $ct_user $upstream_http_x_ct_user;
    auth_request_set $ct_side $upstream_http_x_ct_side;
    proxy_pass http://$ct_side;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Remote-User $ct_user;
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
}

location ^~ /app/ {
    auth_request     /_ct_authz;
    auth_request_set $ct_user $upstream_http_x_ct_user;
    auth_request_set $ct_side $upstream_http_x_ct_side;
    proxy_pass http://$ct_side;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Remote-User $ct_user;
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    # /app/stream/<id> is a long-lived SSE channel (app-server.ts pings every 20s) and
    # voice POSTs audio to /app/api/stt. Buffering here would stall replies mid-stream.
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no always;
}

# ---------------------------------------------------------------------------
# /usage — the dashboard. PUBLIC on purpose: no auth_request, unlike every other block.
#
# server.ts only serves this tree when config usagePage is not false, and it exposes
# nothing but aggregate token counts. /usage/export stays token-gated inside the app
# (404 until exportToken is set), which is why it is safe to leave this whole prefix open.
#
# NOTE: nginx is not the only gate. Cloudflare Access sits in front of this hostname, so
# the tree is still behind the CF login until a Bypass policy is added for
# claude.brandmcd.com/usage* in the Cloudflare Zero Trust dashboard. Removing
# auth_request here is necessary but NOT sufficient.
# nginx listens on 127.0.0.1:8080 behind cloudflared, so an absolute Location here
# would be built as http://claude.brandmcd.com:8080/usage/ and leak the internal
# listener to the browser. Relative redirects keep the public scheme and port.
absolute_redirect off;
location = /usage { return 301 /usage/; }

location ^~ /usage/ {
    auth_request off;
    # No auth subrequest runs here, so $ct_side is never populated and cannot be used.
    # The owner sidecar's address is fixed in /etc/claude-terminal/config.json
    # (host 127.0.0.1, port 7682), so address it directly.
    proxy_pass http://127.0.0.1:7682;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    # /usage/stream is SSE (server.ts pushes on every collector tick).
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no always;
}

# ---------------------------------------------------------------------------
# One site. The app (with its retro desktop) is the home page; ttyd lives under /tty/
# (ct-ttyd runs with --base-path /tty) and the desktop shows each tab in a window.
# `= /` is an exact match, so it wins over the catch-all `location /` below it. Old links
# of the form /?arg=N keep working: the query string rides along and the app opens tab N.
location = / { return 302 /app$is_args$args; }
location = /tty { return 301 /tty/; }
location ^~ /tty/ {
    auth_request     /_ct_authz;
    auth_request_set $ct_user $upstream_http_x_ct_user;
    auth_request_set $ct_tty  $upstream_http_x_ct_tty;
    proxy_pass http://$ct_tty;                 # no URI part: ttyd expects the /tty prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Remote-User $ct_user;
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    proxy_buffering    off;
    proxy_read_timeout 86400s;                 # an idle terminal must not be reaped
    proxy_send_timeout 86400s;
}

# The Clawd favicon, for every page on the host (browsers ask for /favicon.ico by default).
location = /favicon.ico { alias /srv/claude-terminal/public/favicon.ico; add_header Cache-Control "public, max-age=86400"; }
location = /favicon.svg { alias /srv/claude-terminal/public/favicon.svg; add_header Cache-Control "public, max-age=86400"; }
