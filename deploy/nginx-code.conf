# Additional location blocks for /etc/nginx/sites-enabled/claude-terminal, inserted by
# deploy/apply-root.sh INSIDE `server { ... }`, above the catch-all `location / `.
# Needs the maps in deploy/nginx-code-map.conf (-> /etc/nginx/conf.d/20-ct-code.conf).

# ---------------------------------------------------------------------------
# /code — code-server (VS Code in the browser). ct-code.service, 127.0.0.1:8443, auth off.
# Owner only: auth_request identifies the user, the $ct_code_backend map turns anyone but
# the owner into a dead backend. code-server serves relative URLs, so stripping the /code/
# prefix (the rewrite) is all it takes to run it under a subpath.
location = /code { return 301 /code/; }

location ^~ /code/ {
    auth_request     /_ct_authz;
    auth_request_set $ct_user $upstream_http_x_ct_user;
    rewrite    ^/code/(.*)$ /$1 break;
    proxy_pass http://$ct_code_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding gzip;
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    proxy_buffering    off;
    proxy_read_timeout 86400s;                 # the editor's WebSocket must not be reaped
    proxy_send_timeout 86400s;
}

# ---------------------------------------------------------------------------
# /p/<port>/ — preview any dev server listening on this box, e.g. a Vite site on 5173 at
# https://claude.brandmcd.com/p/5173/. Owner only via the $ct_preview_backend map.
# Sites that use absolute asset URLs (/assets/x.js) break under a subpath; start them with
# a base path (vite --base /p/5173/, `python3 -m http.server` is fine as is) or use
# code-server's own /code/proxy/<port>/ which has the same limitation.
location ~ "^/p/(?<ct_pport>\d{2,5})$" { return 301 /p/$ct_pport/; }

location ~ "^/p/(?<ct_pport>\d{2,5})/(?<ct_ppath>.*)$" {
    auth_request     /_ct_authz;
    auth_request_set $ct_user $upstream_http_x_ct_user;
    proxy_pass http://$ct_preview_backend/$ct_ppath$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    proxy_buffering    off;
    proxy_read_timeout 3600s;
}
